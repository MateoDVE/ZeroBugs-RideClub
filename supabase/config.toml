project_id = "rideclub"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://ride-club.vercel.app"
additional_redirect_urls = ["https://ride-club.vercel.app", "https://ride-club.vercel.app/**", "http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.manage-user]
verify_jwt = true

[functions.bootstrap-admin]
verify_jwt = false

[functions.integration-api]
verify_jwt = false
